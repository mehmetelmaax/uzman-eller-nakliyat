name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-to-cache-node-modules: true
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Typecheck
      run: npm run typecheck

    - name: Run Lint
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test

    - name: Build Next.js app
      run: npm run build
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

    - name: Run SEO & Link Audit
      run: npm run audit
